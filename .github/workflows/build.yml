name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            target
            schemas/gschemas.compiled
            .eslintcache
            *.tsbuildinfo
          key: ${{ runner.os }}-shatter-${{ hashFiles('metadata.json') }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-shatter-${{ hashFiles('metadata.json') }}-

      - name: Get dependencies
        run: npm ci

      - name: Build
        run: make zip-file --assume-old=node_modules/.package-lock.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: shatter-shell@adilhanney.com_*.zip
          if-no-files-found: error
          archive: false

      - name: Run lints
        run: make CUSTOM_ESLINT_ARGS="--cache-strategy content" lint

      - name: Shexli lints
        uses: stuarthayhurst/shexli-github-action@81c25e448506a299c12162e78db901a3b0f1109f
        with:
          path: _build/
          # EGO-P-007: Unnecessary files: False positive on our dialogs
          # EGO-P-005: Bundled binaries: False positive on schema xml
          # EGO-M-004: Invalid shell version: Shexli hasn't updated for GNOME 51 yet
          ignored-checks: 'EGO-P-007 EGO-P-005 EGO-M-004'
